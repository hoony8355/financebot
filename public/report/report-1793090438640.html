    <title>Azitra, Inc. (AZTR): 정밀 피부과 혁신과 초고변동성 시장의 기회 및 위험 분석</title>
    <meta name="description" content="Azitra, Inc. (AZTR)는 정밀 피부과 분야에 중점을 둔 초기 단계 임상 바이오 제약 회사로, 공학 단백질 및 국소 생체 치료 제품을 활용하여 피부 질환 치료법을 개발하고 있습니다. 주요 파이프라인에는 암 환자의 발진 치료를 위한 ATR-04 (1/2상, FDA Fast Track 지정), Netherton 증후군 치료를 위한 ATR-12 (1b/2a상), 어린선(Ichthyosis vulgaris) 치료를 위한 ATR-01 (IND-준비 단계) 등이 있습니다. 회사는 인공지능과 머신러닝 기술을 플랫폼에 통합하고 있습니다. 최근에는 자사의 미용 제품 후보인 ATR-COSF의 생체 외(ex vivo) 연구에서 주름 감소 및 피부 탄력 개선이라는 긍정적인 결과를 발표했습니다. 또한, NYSE American 상장 기준을 충족하기 위해 2026년 10월 26일에 1대 10 역 주식 분할을 단행했으며, 시장 판매 프로그램(at-the-market offering program)을 일시 중단했습니다." />
